aid: general-aviation
name: General Aviation
description: General Aviation is a Y Combinator-backed startup (Spring 2026 batch) building a new air
  traffic control (ATC) system by connecting aircraft to the internet. Founded by Ben Frank, the company
  develops remote ATC tower technology aimed at the roughly 90 percent of airports in the U.S. National
  Airspace System that currently operate without control towers, giving smaller airfields an affordable
  path to the safety and efficiency benefits of tower services without the cost of traditional tower
  infrastructure and staffing. As of this profile the company operates a single marketing landing page
  and publishes no public developer API, documentation, or SDK surface.
